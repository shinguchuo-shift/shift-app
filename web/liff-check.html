<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIFF 動作チェック</title>
<link rel="stylesheet" href="css/app.css?v=6">
<style>
  body { padding: 14px; background: #e9edf2; }
  .wrap { max-width: 420px; }
  .row { display: flex; justify-content: space-between; gap: 10px;
         padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border: 0; }
  .row b { font-weight: 400; color: var(--sub); flex: none; }
  .row span { text-align: right; word-break: break-all; font-weight: 600; }
  .ok { color: var(--ok); }
  .ng { color: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>LIFF 動作チェック</h2>
    <p class="lead">この画面は確認用。うまくいけば下が全部 ✓ になる。</p>
    <div id="out"><div class="state">調べています…</div></div>
  </div>
</div>

<script type="module">
import { LIFF_ID_STAFF } from './js/config.js?v=3';
import { call } from './js/api.js?v=3';

const out = document.getElementById('out');
const rows = [];
const add = (k, v, ok) => {
  rows.push(`<div class="row"><b>${k}</b><span class="${ok === undefined ? '' : ok ? 'ok' : 'ng'}">${
    ok === undefined ? '' : (ok ? '✓ ' : '✕ ')}${String(v)}</span></div>`);
  out.innerHTML = rows.join('');
};

try {
  add('LIFF ID', LIFF_ID_STAFF || '(未設定)', !!LIFF_ID_STAFF);

  await new Promise((ok, ng) => {
    const s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = ok; s.onerror = () => ng(new Error('SDK を読み込めません'));
    document.head.appendChild(s);
  });
  add('SDK の読み込み', '成功', true);

  await liff.init({ liffId: LIFF_ID_STAFF });
  add('liff.init()', '成功', true);

  const ctx = liff.getContext() || {};
  add('どこから開いたか', ctx.type || '(不明)', true);
  add('LINEアプリの中か', liff.isInClient() ? 'はい' : 'いいえ（外部ブラウザ）', liff.isInClient());
  add('ログイン済みか', liff.isLoggedIn() ? 'はい' : 'いいえ', liff.isLoggedIn());

  if (!liff.isLoggedIn()) {
    add('→ ログインします', '画面が切り替わります');
    liff.login({ redirectUri: location.href });
  } else {
    const p = await liff.getProfile();
    add('あなたの表示名', p.displayName, true);
    add('ユーザーID', p.userId.slice(0, 8) + '…（' + p.userId.length + '文字）', true);

    const t = liff.getIDToken();
    add('IDトークン', t ? '取得できた（' + t.length + '文字）' : '取得できない', !!t);

    // GAS まで届くか
    try {
      const d = await call('ping', {}, { idToken: t });
      add('GAS との通信', 'つながった（開発モード: ' + d.devMode + '）', true);
    } catch (e) {
      add('GAS との通信', e.message, false);
    }

    add('', '<br>ここまで ✓ なら、本番に進めます。', undefined);
  }
} catch (err) {
  add('エラー', err.message || String(err), false);
}
</script>
</body>
</html>
